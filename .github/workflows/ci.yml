name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code and fail if stale
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code
      - name: Check design tokens against tokens.json
        run: |
          if [ -f tool/gen_tokens.dart ]; then
            dart run tool/gen_tokens.dart
            git diff --exit-code
          fi
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href /sprint-app/
