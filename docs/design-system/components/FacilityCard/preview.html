<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<title>FacilityCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=Cairo:wght@400;500;600;700&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--bg); color:var(--ink); font-family:var(--font-text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 300px)); gap:var(--space-4); }
  .card { background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden; }
  .media { height:136px; background:var(--surface-sunken); display:flex; align-items:center; justify-content:center; font:400 13px/20px var(--font-text); color:var(--ink-muted); position:relative; }
  .tags { position:absolute; top:var(--space-3); inset-inline-start:var(--space-3); display:flex; gap:var(--space-1); }
  .tag { font:500 12px/16px var(--font-text); padding:4px var(--space-2); border-radius:var(--radius-full); background:var(--surface); color:var(--ink); }
  .tag.soft { background:var(--primary-soft); color:var(--on-primary-soft); }
  .body { padding:var(--space-4); display:flex; flex-direction:column; gap:var(--space-1); }
  .name { font:600 17px/26px var(--font-heading); color:var(--ink); margin:0; }
  .unit { font:400 13px/20px var(--font-text); color:var(--ink-muted); }
  .avail { display:flex; align-items:center; gap:var(--space-1); font:500 13px/20px var(--font-text); color:var(--success); margin-top:var(--space-2); }
  .avail.low { color:var(--warning); }
  .avail svg { width:16px; height:16px; }
  .foot { display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid var(--line); margin-top:var(--space-3); padding-top:var(--space-3); }
  .price { font:600 15px/24px var(--font-text); color:var(--ink); }
  .who { font:400 13px/20px var(--font-text); color:var(--ink-muted); }
</style>
</head>
<body>
<div class="grid">
  <article class="card">
    <div class="media">صورة المنشأة<div class="tags"><span class="tag">سباحة</span><span class="tag soft">بمدرب</span></div></div>
    <div class="body">
      <h3 class="name">حمام السباحة الأوليمبي</h3>
      <span class="unit">كلية التربية الرياضية · 8 حارات</span>
      <span class="avail"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>14 مكان فاضي النهارده</span>
      <div class="foot"><span class="price">من 80 ج.م</span><span class="who">سعر الطلاب والعاملين</span></div>
    </div>
  </article>
  <article class="card">
    <div class="media">صورة المنشأة<div class="tags"><span class="tag">كرة قدم</span><span class="tag soft">مجاني</span></div></div>
    <div class="body">
      <h3 class="name">ملعب الاستاد الخماسي</h3>
      <span class="unit">إدارة استاد الجامعة · ملعبين</span>
      <span class="avail low"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>ميعادين بس فاضيين النهارده</span>
      <div class="foot"><span class="price">مجاني</span><span class="who">للطلاب بس</span></div>
    </div>
  </article>
</div>
</body>
</html>
