<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<title>StatusBadge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=Cairo:wght@400;500;600;700&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--surface); color:var(--ink); font-family:var(--font-text); }
  .row { display:flex; flex-wrap:wrap; gap:var(--space-2); }
  .b { display:inline-flex; align-items:center; gap:var(--space-1); height:28px; padding:0 var(--space-3); border-radius:var(--radius-full); font:500 12px/16px var(--font-text); }
  .b svg { width:16px; height:16px; }
  .ok { background:var(--success-soft); color:var(--success); }
  .wait { background:var(--warning-soft); color:var(--warning); }
  .bad { background:var(--danger-soft); color:var(--danger); }
  .done { background:var(--primary-soft); color:var(--on-primary-soft); }
  .mute { background:var(--surface-sunken); color:var(--ink-muted); }
</style>
</head>
<body>
<div class="row">
  <span class="b ok"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>مؤكد</span>
  <span class="b wait"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>في انتظار الدفع</span>
  <span class="b bad"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>اتلغى</span>
  <span class="b done"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 8.5l2.5 2.5L9 6.5M7 11l1 1 6-6"/></svg>حضر</span>
  <span class="b mute"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M4 12l8-8"/></svg>غاب</span>
  <span class="b mute"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 2h6M5 14h6M5.5 2c0 3 5 3 5 6s-5 3-5 6M10.5 2c0 3-5 3-5 6s5 3 5 6"/></svg>انتهت المهلة</span>
</div>
</body>
</html>
