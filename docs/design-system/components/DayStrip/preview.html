<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<title>DayStrip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=Cairo:wght@400;500;600;700&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--bg); color:var(--ink); font-family:var(--font-text); }
  .strip { display:flex; gap:var(--space-2); background:var(--surface); border-radius:var(--radius-lg); padding:var(--space-3); max-width:560px; overflow-x:auto; }
  .day { flex:1 0 56px; min-height:64px; border-radius:var(--radius-full); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative; }
  .d { font:500 12px/16px var(--font-text); color:var(--ink-muted); }
  .n { font:600 17px/24px var(--font-text); color:var(--ink); }
  .today .d { color:var(--primary); font-weight:600; }
  .sel { background:var(--primary); }
  .sel .d, .sel .n { color:var(--on-primary); }
  .dot { width:4px; height:4px; border-radius:50%; background:var(--success); position:absolute; bottom:6px; }
</style>
</head>
<body>
<div class="strip" role="tablist">
  <div class="day today" role="tab"><span class="d">النهارده</span><span class="n">8</span><span class="dot" aria-hidden="true"></span></div>
  <div class="day" role="tab"><span class="d">الاتنين</span><span class="n">9</span><span class="dot" aria-hidden="true"></span></div>
  <div class="day sel" role="tab" aria-selected="true"><span class="d">التلات</span><span class="n">10</span></div>
  <div class="day" role="tab"><span class="d">الأربع</span><span class="n">11</span></div>
  <div class="day" role="tab"><span class="d">الخميس</span><span class="n">12</span><span class="dot" aria-hidden="true"></span></div>
  <div class="day" role="tab"><span class="d">الجمعة</span><span class="n">13</span></div>
  <div class="day" role="tab"><span class="d">السبت</span><span class="n">14</span><span class="dot" aria-hidden="true"></span></div>
</div>
</body>
</html>
