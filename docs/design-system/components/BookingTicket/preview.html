<!-- @dsCard group="Booking" height=600 subtitle="confirmation and my bookings" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<title>BookingTicket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--bg); color:var(--ink); font-family:var(--font-text); }
  .ticket { width:340px; background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); position:relative; }
  .top { padding:var(--space-5) var(--space-5) var(--space-4); }
  .badge { display:inline-flex; align-items:center; gap:var(--space-1); height:28px; padding:0 var(--space-3); border-radius:var(--radius-full); background:var(--success-soft); color:var(--success); font:500 12px/16px var(--font-text); }
  .badge svg { width:16px; height:16px; }
  .name { font:600 17px/26px var(--font-heading); margin:var(--space-3) 0 0; }
  .sub { font:400 13px/20px var(--font-text); color:var(--ink-muted); }
  .when { display:flex; gap:var(--space-2); align-items:center; margin-top:var(--space-3); background:var(--volt); color:var(--on-volt); border-radius:var(--radius-sm); padding:var(--space-2) var(--space-3); font:600 14px/20px var(--font-text); }
  .cut { position:relative; height:24px; }
  .cut::before { content:""; position:absolute; top:11px; inset-inline:var(--space-5); border-top:2px dashed var(--line); }
  .notch { position:absolute; top:0; width:24px; height:24px; border-radius:50%; background:var(--bg); }
  .notch.s { inset-inline-start:-12px; } .notch.e { inset-inline-end:-12px; }
  .qrwrap { display:flex; flex-direction:column; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-5) var(--space-4); }
  .qr { background:var(--qr-ground); padding:12px; border-radius:var(--radius-md); }
  .qr svg { display:block; width:168px; height:168px; }
  .qr rect { fill:var(--qr-ink); }
  .code { font:500 17px/24px var(--font-mono); letter-spacing:0.08em; direction:ltr; unicode-bidi:isolate; color:var(--ink); }
  .hint { font:400 13px/20px var(--font-text); color:var(--ink-muted); }
  .rows { border-top:1px solid var(--line); padding:var(--space-3) var(--space-5) var(--space-4); display:grid; grid-template-columns:auto 1fr; row-gap:var(--space-2); column-gap:var(--space-4); }
  .k { font:400 13px/20px var(--font-text); color:var(--ink-muted); }
  .v { font:600 15px/20px var(--font-text); text-align:end; }
</style>
</head>
<body>
<div class="ticket">
  <div class="top">
    <span class="badge"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>مؤكد</span>
    <h3 class="name">حمام السباحة الأوليمبي</h3>
    <div class="sub">حارة 3 · مع الكابتن أحمد سامي</div>
    <div class="when">التلات 10 نوفمبر · 5:00 – 6:00 م</div>
  </div>
  <div class="cut"><span class="notch s"></span><span class="notch e"></span></div>
  <div class="qrwrap">
    <div class="qr"><svg id="qr" viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="كود QR للحجز"></svg></div>
    <span class="code">SPR-7K2Q9</span>
    <span class="hint">وريه للمدرب عند الدخول</span>
  </div>
  <div class="rows">
    <span class="k">المدفوع</span><span class="v">120 ج.م</span>
    <span class="k">الإلغاء متاح لحد</span><span class="v">3:00 م</span>
  </div>
</div>
<script>
  var s = document.getElementById('qr'), n = 25, seed = 7, out = '';
  function finder(x, y) { out += '<rect x="'+x+'" y="'+y+'" width="7" height="7"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" style="fill:var(--qr-ground)"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>'; }
  function inFinder(x, y) { return (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); }
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    if (!inFinder(x, y) && (seed >> 16) % 2) out += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  }
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  s.innerHTML = out;
</script>
</body>
</html>
