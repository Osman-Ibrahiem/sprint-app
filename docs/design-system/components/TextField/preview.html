<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<title>TextField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=Cairo:wght@400;500;600;700&display=swap">
<style>
  body { margin:0; padding:var(--space-4); background:var(--bg); color:var(--ink); font-family:var(--font-text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:var(--space-5); max-width:820px; }
  .field { display:flex; flex-direction:column; gap:var(--space-2); }
  .lbl { font:600 14px/20px var(--font-text); color:var(--ink); }
  .box { height:var(--control-height); border-radius:var(--radius-sm); background:var(--surface); box-shadow:inset 0 0 0 1px var(--control-border); display:flex; align-items:center; padding:0 var(--space-3); gap:var(--space-2); font:400 15px/24px var(--font-text); }
  .ph { color:var(--ink-muted); flex:1; }
  .val { color:var(--ink); flex:1; }
  .ltr { direction:ltr; text-align:end; unicode-bidi:isolate; }
  .focused { box-shadow:inset 0 0 0 2px var(--primary); }
  .error { box-shadow:inset 0 0 0 2px var(--danger); background:var(--danger-soft); }
  .help { font:400 13px/20px var(--font-text); color:var(--ink-muted); }
  .err { font:400 13px/20px var(--font-text); color:var(--danger); display:flex; gap:var(--space-1); align-items:center; }
  .act { font:600 14px/20px var(--font-text); color:var(--primary); }
  .search { background:var(--surface-sunken); box-shadow:none; border-radius:var(--radius-full); }
  svg { width:20px; height:20px; flex:none; }
</style>
</head>
<body>
<div class="grid">
  <div class="field">
    <span class="lbl">الإيميل أو رقم الموبايل</span>
    <div class="box"><span class="ph">name@tanta.edu.eg</span></div>
    <span class="help">هتستخدمه في الدخول وفي إشعارات الحجز.</span>
  </div>
  <div class="field">
    <span class="lbl">كلمة السر</span>
    <div class="box focused"><span class="val ltr">••••••••</span><span class="act">إظهار</span></div>
    <span class="help">8 حروف على الأقل.</span>
  </div>
  <div class="field">
    <span class="lbl">الرقم القومي</span>
    <div class="box error"><span class="val ltr">2990512160</span></div>
    <span class="err"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 14h.01"/></svg>الرقم القومي 14 رقم، والمكتوب 10 بس.</span>
  </div>
  <div class="field">
    <span class="lbl">بحث</span>
    <div class="box search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="color:var(--ink-muted)"><circle cx="9" cy="9" r="6"/><path d="M17 17l-3.5-3.5"/></svg><span class="ph">منشأة، رياضة، أو كلية</span></div>
  </div>
</div>
</body>
</html>
