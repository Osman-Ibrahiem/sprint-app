include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.2.0

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  # No excluded lib/ folders; generated code is analysed too.
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
